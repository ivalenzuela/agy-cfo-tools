<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGY CFO &amp; Finance Cockpit</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --gold: #f59e0b;
      --emerald: #10b981;
      --cyan: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: var(--gold);
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald);
      border: 1px solid var(--emerald);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .card h3 {
      margin: 0 0 10px 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--cyan);
    }
    input, select, button, textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0b1120;
      color: var(--text);
      font-size: 12px;
      margin-bottom: 8px;
    }
    button {
      background: var(--gold);
      color: #0f172a;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }
    button:hover { opacity: 0.92; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .skill-item {
      padding: 8px;
      border-bottom: 1px solid var(--border);
    }
    .skill-item:last-child { border-bottom: none; }
    .skill-name {
      font-weight: 700;
      color: var(--emerald);
      font-family: monospace;
    }
    .skill-cat {
      font-size: 11px;
      color: var(--gold);
      margin-left: 6px;
    }
    .skill-desc {
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 3px;
    }
    .kpi-box {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }
    .kpi-val {
      font-size: 15px;
      font-weight: 700;
      color: var(--emerald);
      font-family: monospace;
    }
    .kpi-lbl {
      font-size: 10.5px;
      color: var(--muted);
    }
    pre {
      background: #0b1120;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      overflow-x: auto;
      font-size: 11px;
      color: var(--cyan);
      margin: 6px 0 0 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">AGY CFO &amp; Finance Cockpit</div>
      <div style="color: var(--muted); font-size: 11px;">Skill Finder + FP&amp;A / Tax Calculators</div>
    </div>
    <span class="badge" id="skillCountBadge">87 Skills Ready</span>
  </div>

  <div class="card">
    <h3>1. JIT Skill Finder (Finanzas, Contabilidad, BI, Impuestos)</h3>
    <input type="text" id="searchInput" placeholder="Buscar ej: xlsx, billing, sifen, bancard, odoo, d3js, kpi..." oninput="runSearch()" />
    <div id="resultsList" style="max-height: 210px; overflow-y: auto; margin-bottom: 8px;"></div>
    <div style="font-size: 11px; color: var(--muted);">Snippet <code>.agents/skills.json</code> (Zero-Copy):</div>
    <pre id="snippetBox">{}</pre>
  </div>

  <div class="card">
    <h3>2. Calculadora Rápida Unit Economics &amp; Runway CFO</h3>
    <div class="grid-2">
      <div>
        <label style="font-size:11px;color:var(--muted);">MRR Actual ($)</label>
        <input type="number" id="mrr" value="125000" oninput="calcFinance()" />
      </div>
      <div>
        <label style="font-size:11px;color:var(--muted);">Margen Bruto (%)</label>
        <input type="number" id="gm" value="78" oninput="calcFinance()" />
      </div>
      <div>
        <label style="font-size:11px;color:var(--muted);">Net Burn Mensual ($)</label>
        <input type="number" id="burn" value="45000" oninput="calcFinance()" />
      </div>
      <div>
        <label style="font-size:11px;color:var(--muted);">Caja Disponible ($)</label>
        <input type="number" id="cash" value="810000" oninput="calcFinance()" />
      </div>
    </div>
    <div class="grid-2" style="margin-top: 6px;">
      <div class="kpi-box">
        <div class="kpi-val" id="arrVal">$1,500,000</div>
        <div class="kpi-lbl">ARR Anualizado</div>
      </div>
      <div class="kpi-box">
        <div class="kpi-val" id="runwayVal">18.0 meses</div>
        <div class="kpi-lbl">Runway de Caja</div>
      </div>
    </div>
  </div>

  <script>
    async function runSearch() {
      const q = document.getElementById('searchInput').value;
      try {
        const res = await fetch('/api/search?q=' + encodeURIComponent(q));
        const data = await res.json();
        document.getElementById('skillCountBadge').textContent = data.total + ' Skills Match';
        const list = document.getElementById('resultsList');
        list.innerHTML = (data.results || []).slice(0, 12).map(s => `
          <div class="skill-item">
            <div><span class="skill-name">${s.name}</span><span class="skill-cat">[${s.category}]</span></div>
            <div class="skill-desc">${(s.description || '').slice(0, 120)}</div>
          </div>
        `).join('');
        document.getElementById('snippetBox').textContent = JSON.stringify(data.skills_json, null, 2);
      } catch (e) {}
    }

    function calcFinance() {
      const mrr = parseFloat(document.getElementById('mrr').value) || 0;
      const burn = parseFloat(document.getElementById('burn').value) || 0;
      const cash = parseFloat(document.getElementById('cash').value) || 0;
      const arr = mrr * 12;
      const runway = burn > 0 ? (cash / burn).toFixed(1) + ' meses' : 'Infinito (Cash+ )';
      document.getElementById('arrVal').textContent = '$' + arr.toLocaleString('en-US');
      document.getElementById('runwayVal').textContent = runway;
    }

    runSearch();
    calcFinance();
  </script>
</body>
</html>
